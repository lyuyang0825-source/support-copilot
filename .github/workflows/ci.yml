name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 单元测试
        run: python3 -m unittest discover -s tests
      - name: 知识库 lint
        run: python3 -m support_copilot.cli --lint
      - name: 决策评测
        run: python3 scripts/run_evals.py
